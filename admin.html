<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050B08">
<title>แอดมิน | Tech Fix Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox=%220%200%2032%2032%22%20xmlns=%22http://www.w3.org/2000/svg%22%3E%3Crect%20x=%221%22%20y=%221%22%20width=%2230%22%20height=%2230%22%20rx=%227%22%20fill=%22%2303100A%22%20stroke=%22%2300FF9C%22%20stroke-width=%222%22/%3E%3Cpath%20d=%22M9%2011l6%205-6%205%22%20stroke=%22%2300FF9C%22%20stroke-width=%222.6%22%20fill=%22none%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%3Cpath%20d=%22M18%2022h6%22%20stroke=%22%23fff%22%20stroke-width=%222.6%22%20stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap"><a class="brand" href="index.html"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="#03100A" stroke="#00FF9C" stroke-width="2"/><path d="M9 11l6 5-6 5" stroke="#00FF9C" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 22h6" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg><span class="bt">Tech Fix Studio</span></a><a class="btn alt" href="account.html">หน้าสมาชิก</a></div></header>
<main><section style="border-top:0"><div class="wrap" style="max-width:900px">
<h2>แอดมิน: ปรับเครดิตสมาชิก</h2>
<div id="loading" class="msg warn">กำลังโหลด...</div>
<div id="fatal" class="msg err" hidden></div>
<div id="nologin" class="msg warn" hidden>กรุณาเข้าสู่ระบบที่ <a href="account.html">หน้าสมาชิก</a> ด้วยบัญชีแอดมินก่อน แล้วกลับมาหน้านี้</div>
<div id="forbidden" class="msg err" hidden>บัญชีนี้ไม่มีสิทธิ์แอดมิน</div>
<div id="panel" hidden>
<div style="max-width:560px">
<label class="f">อีเมลสมาชิก<input id="em" type="email" autocomplete="off"></label>
<button class="btn alt" id="look" type="button">ดูยอดคงเหลือ</button>
<p style="margin:14px 0 22px">ยอดคงเหลือ: <span class="bal" id="bal">–</span></p>
<label class="f">จำนวนเครดิต (จำนวนเต็ม)<input id="amt" type="number" min="1" step="1" inputmode="numeric"></label>
<label class="f">หมายเหตุ (เช่น งานแก้บัคหน้าชำระเงิน)<input id="note" type="text" maxlength="200"></label>
<div id="out" class="msg" hidden role="alert"></div>
<div class="cta"><button class="btn" id="ded" type="button">หักเครดิต</button><button class="btn alt" id="add" type="button">เพิ่มเครดิต</button></div>
</div>
<h2 style="margin-top:56px">รายการงานจากลูกค้า</h2>
<div class="chips" id="chips" role="group" aria-label="กรองตามสถานะ"></div>
<div class="jsearch"><input id="jq" type="search" maxlength="60" placeholder="ค้นหาจากอีเมล หัวข้อ หรือรายละเอียด" aria-label="ค้นหางาน"><button class="btn alt" id="jobsreload" type="button">รีเฟรช</button></div>
<div id="jobsmsg" class="msg" hidden role="alert"></div>
<div id="jobs"></div>
<div class="row" style="margin-top:14px"><button class="btn alt" id="jmore" type="button" hidden>โหลดเพิ่ม</button><span class="note" id="jcount" style="margin:0"></span></div>
</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const cfg=window.SITE_CONFIG||{};
const show=id=>{['loading','fatal','nologin','forbidden','panel'].forEach(x=>$(x).hidden=x!==id)};
function out(t,c){const m=$('out');m.textContent=t||'';m.className='msg '+(c||'');m.hidden=!t}
let sb;
async function call(body,url){
 const{data}=await sb.auth.getSession();if(!data.session){const e=new Error('nologin');e.status=401;throw e}
 const r=await fetch(url||'/api/admin-credit',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+data.session.access_token},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));
 if(!r.ok){const e=new Error(j.error||'เกิดข้อผิดพลาด');e.status=r.status;throw e}
 return j;
}

const SL={new:'รอตอบรับ',doing:'กำลังทำ',done:'เสร็จแล้ว',cancelled:'ยกเลิก'};
const API_JOBS='/api/admin-jobs';
const VIEWS=[['awaiting','รอตอบ'],['doing','กำลังทำ'],['done','เสร็จแล้ว'],['cancelled','ยกเลิก'],['all','ทั้งหมด']];
let view='awaiting',q='',offset=0,total=0,loading=false,timer=null;
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function jm(t,c){const m=$('jobsmsg');m.textContent=t||'';m.className='msg '+(c||'');m.hidden=!t}
function ago(t){const s=(Date.now()-new Date(t).getTime())/1000;if(s<60)return'เมื่อสักครู่';if(s<3600)return Math.floor(s/60)+' นาทีที่แล้ว';if(s<86400)return Math.floor(s/3600)+' ชั่วโมงที่แล้ว';if(s<2592000)return Math.floor(s/86400)+' วันที่แล้ว';return new Date(t).toLocaleDateString('th-TH')}
function buildChips(){
 const box=$('chips');
 VIEWS.forEach(([k,t])=>{const b=el('button','chip',t);b.type='button';b.dataset.k=k;b.dataset.t=t;b.setAttribute('aria-pressed',k===view?'true':'false');
  b.onclick=()=>{view=k;[...box.children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.k===view?'true':'false'));loadJobs(true)};box.append(b)});
}
async function refreshCounts(){
 try{const r=await call({action:'counts'},API_JOBS);[...$('chips').children].forEach(c=>{const n=r.counts[c.dataset.k];c.textContent=c.dataset.t+(n!=null?' ('+n+')':'')})}catch(e){}
}
async function loadJobs(reset){
 if(loading)return;loading=true;jm('');
 const box=$('jobs');if(reset){offset=0;box.textContent=''}
 try{
  const r=await call({action:'list',view,q,offset},API_JOBS);total=r.total;
  r.jobs.forEach(j=>box.append(jobRow(j)));offset+=r.jobs.length;
  if(!box.children.length)box.append(el('p','note',view==='awaiting'&&!q?'ไม่มีงานที่รอตอบ ดูแท็บอื่นได้ด้านบน':'ไม่พบรายการ'));
  $('jcount').textContent=total?'แสดง '+Math.min(offset,total)+' จาก '+total+' รายการ':'';
  $('jmore').hidden=offset>=total;
 }catch(e){jm(e.message,'err')}
 loading=false;
}
function initJobs(){
 buildChips();refreshCounts();loadJobs(true);
 $('jobsreload').onclick=()=>{refreshCounts();loadJobs(true)};
 $('jmore').onclick=()=>loadJobs(false);
 $('jq').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{q=$('jq').value.trim();loadJobs(true)},350)};
}
function bubble(m){const b=el('div','bubble '+(m.sender_role==='admin'?'me':'them'));b.append(el('div','who',m.sender_role==='admin'?'ทีมงาน':'ลูกค้า'),el('div','txt',m.body),el('div','ts',new Date(m.created_at).toLocaleString('th-TH')));return b}
function adminThread(job,onSent){
 const box=el('div','thread'),list=el('div','msgs');box.hidden=true;
 const ta=el('textarea');ta.maxLength=2000;ta.rows=2;ta.placeholder='พิมพ์ข้อความถึงลูกค้า (ลูกค้าจะเห็นในแท็บ "งานของฉัน" และมีแจ้งเตือนที่กระดิ่ง)';
 const send=el('button','btn','ส่งข้อความ');send.type='button';const st=el('div','msg');st.hidden=true;
 async function load(){
  try{const j=await call({action:'messages',id:job.id},API_JOBS);list.textContent='';
   if(!j.messages.length)list.append(el('p','note','ยังไม่มีข้อความ'));
   j.messages.forEach(m=>list.append(bubble(m)));list.scrollTop=list.scrollHeight}
  catch(e){list.textContent='';list.append(el('p','note',e.message))}
 }
 send.onclick=async()=>{
  const body=ta.value.trim();if(!body)return;send.disabled=true;st.hidden=true;
  try{
   const{data}=await sb.auth.getSession();
   const r=await fetch('/api/job-message',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+data.session.access_token},body:JSON.stringify({job_id:job.id,body})});
   const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'ส่งข้อความไม่สำเร็จ');
   ta.value='';await load();if(onSent)onSent();
  }catch(e){st.textContent=e.message;st.className='msg err';st.hidden=false}
  send.disabled=false;
 };
 box.append(list,ta,send,st);box.load=load;return box;
}
function badges(job,box){
 box.textContent='';box.append(el('span','badge '+job.status,SL[job.status]||job.status));
 if(job.awaiting_admin&&job.status!=='cancelled')box.append(el('span','badge wait','รอตอบ'));
 if(job.charged)box.append(el('span','badge done','หักแล้ว '+Number(job.price_credits).toLocaleString('th-TH')));
}
function jobRow(job){
 const email=(job.profiles&&job.profiles.email)||'-',c=el('div','job compact'),head=el('button','jrow');
 head.type='button';head.setAttribute('aria-expanded','false');
 const left=el('div');left.append(el('div','t',job.title),el('div','m',email+' · '+ago(job.updated_at||job.created_at)));
 const bd=el('div','jb');head.append(left,bd);badges(job,bd);
 const body=el('div','jbody');body.hidden=true;
 head.onclick=()=>{const open=body.hidden;body.hidden=!open;head.setAttribute('aria-expanded',open?'true':'false');if(open&&!body.childElementCount)fillBody(body,job,bd,email)};
 c.append(head,body);return c;
}
function fillBody(c,job,bd,email){
 c.append(el('div','meta','ส่งเมื่อ '+new Date(job.created_at).toLocaleString('th-TH')));
 c.append(el('p',null,job.details));
 if(job.link&&/^https?:\/\//i.test(job.link)){const a=el('a',null,job.link);a.href=job.link;a.target='_blank';a.rel='noopener noreferrer nofollow';const m=el('div','meta');m.append('ลิงก์: ',a);c.append(m)}
 if(job.contact)c.append(el('div','meta','ติดต่อกลับ: '+job.contact));
 const ctl=el('div','ctl'),sel=el('select');
 Object.keys(SL).forEach(k=>{const o=el('option',null,SL[k]);o.value=k;if(k===job.status)o.selected=true;sel.append(o)});
 const note=el('input');note.type='text';note.maxLength=500;note.placeholder='หมายเหตุสถานะที่ลูกค้าเห็น (ไม่บังคับ)';note.value=job.admin_note||'';note.style.flex='1 1 200px';
 const save=el('button','btn alt','บันทึกสถานะ');save.type='button';
 save.onclick=async()=>{save.disabled=true;try{await call({action:'status',id:job.id,status:sel.value,note:note.value},API_JOBS);job.status=sel.value;job.awaiting_admin=false;badges(job,bd);refreshCounts();jm('บันทึกสถานะแล้ว','ok')}catch(e){jm(e.message,'err')}save.disabled=false};
 ctl.append(sel,note,save);c.append(ctl);
 if(!job.charged){
  const c2=el('div','ctl'),n=el('input');n.type='number';n.min=1;n.step=1;n.placeholder='เครดิตที่จะหัก';n.inputMode='numeric';
  const ch=el('button','btn','หักเครดิตงานนี้');ch.type='button';
  ch.onclick=async()=>{
   const v=Number(n.value);if(!Number.isInteger(v)||v<1){jm('กรอกจำนวนเครดิตเป็นจำนวนเต็ม','err');return}
   if(!confirm('หัก '+v.toLocaleString('th-TH')+' เครดิต จาก '+email+' สำหรับงาน "'+job.title+'" ใช่หรือไม่?'))return;
   ch.disabled=true;
   try{const r=await call({action:'charge',id:job.id,credits:v},API_JOBS);job.charged=true;job.price_credits=v;badges(job,bd);c2.remove();jm('หักเครดิตสำเร็จ ยอดคงเหลือใหม่ '+fmt(r.credits),'ok')}
   catch(e){jm(e.message,'err');ch.disabled=false}
  };
  c2.append(n,ch);c.append(c2);
 }
 const th=adminThread(job,()=>{job.awaiting_admin=false;badges(job,bd);refreshCounts()}),tb=el('button','btn alt','เปิดแชตกับลูกค้า');tb.type='button';
 tb.onclick=()=>{th.hidden=!th.hidden;if(!th.hidden)th.load()};
 const row=el('div','ctl');row.append(tb);c.append(row,th);
}
const fmt=n=>Number(n).toLocaleString('th-TH')+' เครดิต';
async function look(){
 out('');try{const j=await call({action:'lookup',email:$('em').value});$('bal').textContent=fmt(j.credits)}
 catch(e){$('bal').textContent='–';out(e.message,'err')}
}
async function adjust(type){
 const email=$('em').value.trim(),amount=Number($('amt').value);
 if(!email||!Number.isInteger(amount)||amount<1){out('กรอกอีเมลและจำนวนเต็มตั้งแต่ 1 ขึ้นไป','err');return}
 if(!confirm((type==='deduct'?'หัก ':'เพิ่ม ')+amount.toLocaleString('th-TH')+' เครดิต ให้ '+email+' ใช่หรือไม่?'))return;
 $('ded').disabled=$('add').disabled=true;out('กำลังดำเนินการ...');
 try{const j=await call({action:'adjust',type,email,amount,note:$('note').value});
  $('bal').textContent=fmt(j.credits);$('amt').value='';out((type==='deduct'?'หัก':'เพิ่ม')+'เครดิตสำเร็จ ยอดคงเหลือใหม่ '+fmt(j.credits),'ok')}
 catch(e){out(e.message,'err')}
 $('ded').disabled=$('add').disabled=false;
}
(async()=>{
 if(!cfg.url||!cfg.anonKey||/YOUR/.test(cfg.url+cfg.anonKey)||!window.supabase){$('fatal').textContent='ตั้งค่า config.js ไม่ถูกต้อง หรือโหลด Supabase ไม่ได้';show('fatal');return}
 sb=supabase.createClient(cfg.url,cfg.anonKey);
 $('look').onclick=look;$('ded').onclick=()=>adjust('deduct');$('add').onclick=()=>adjust('add');
 try{await call({action:'check'});show('panel');initJobs()}
 catch(e){if(e.status===403)show('forbidden');else if(e.status===401)show('nologin');else{$('fatal').textContent=e.message;show('fatal')}}
})();
</script>
</body>
</html>
