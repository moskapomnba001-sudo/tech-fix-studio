<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0D1B2A">
<title>แอดมิน | Tech Fix Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox=%220%200%2032%2032%22%20xmlns=%22http://www.w3.org/2000/svg%22%3E%3Crect%20width=%2232%22%20height=%2232%22%20rx=%228%22%20fill=%22%230D1B2A%22/%3E%3Cpath%20d=%22M12%2010l-6%206%206%206%22%20stroke=%22%23F5A623%22%20stroke-width=%222.6%22%20fill=%22none%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%3Cpath%20d=%22M20%2010l6%206-6%206%22%20stroke=%22%23fff%22%20stroke-width=%222.6%22%20fill=%22none%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%3Cpath%20d=%22M17.6%208.5l-3.2%2015%22%20stroke=%22%23F5A623%22%20stroke-width=%222.6%22%20stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap"><a class="brand" href="index.html"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0D1B2A"/><path d="M12 10l-6 6 6 6" stroke="#F5A623" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 10l6 6-6 6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.6 8.5l-3.2 15" stroke="#F5A623" stroke-width="2.6" stroke-linecap="round"/></svg>Tech Fix Studio</a><a class="btn alt" href="account.html">หน้าสมาชิก</a></div></header>
<main><section style="border-top:0"><div class="wrap" style="max-width:560px">
<h2>แอดมิน: ปรับเครดิตสมาชิก</h2>
<div id="loading" class="msg warn">กำลังโหลด...</div>
<div id="fatal" class="msg err" hidden></div>
<div id="nologin" class="msg warn" hidden>กรุณาเข้าสู่ระบบที่ <a href="account.html">หน้าสมาชิก</a> ด้วยบัญชีแอดมินก่อน แล้วกลับมาหน้านี้</div>
<div id="forbidden" class="msg err" hidden>บัญชีนี้ไม่มีสิทธิ์แอดมิน</div>
<div id="panel" hidden>
<label class="f">อีเมลสมาชิก<input id="em" type="email" autocomplete="off"></label>
<button class="btn alt" id="look" type="button">ดูยอดคงเหลือ</button>
<p style="margin:14px 0 22px">ยอดคงเหลือ: <span class="bal" id="bal">–</span></p>
<label class="f">จำนวนเครดิต (จำนวนเต็ม)<input id="amt" type="number" min="1" step="1" inputmode="numeric"></label>
<label class="f">หมายเหตุ (เช่น งานแก้บัคหน้าชำระเงิน)<input id="note" type="text" maxlength="200"></label>
<div id="out" class="msg" hidden role="alert"></div>
<div class="cta"><button class="btn" id="ded" type="button">หักเครดิต</button><button class="btn alt" id="add" type="button">เพิ่มเครดิต</button></div>
</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const cfg=window.SITE_CONFIG||{};
const show=id=>{['loading','fatal','nologin','forbidden','panel'].forEach(x=>$(x).hidden=x!==id)};
function out(t,c){const m=$('out');m.textContent=t||'';m.className='msg '+(c||'');m.hidden=!t}
let sb;
async function call(body){
 const{data}=await sb.auth.getSession();if(!data.session){const e=new Error('nologin');e.status=401;throw e}
 const r=await fetch('/api/admin-credit',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+data.session.access_token},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));
 if(!r.ok){const e=new Error(j.error||'เกิดข้อผิดพลาด');e.status=r.status;throw e}
 return j;
}
const fmt=n=>Number(n).toLocaleString('th-TH')+' เครดิต';
async function look(){
 out('');try{const j=await call({action:'lookup',email:$('em').value});$('bal').textContent=fmt(j.credits)}
 catch(e){$('bal').textContent='–';out(e.message,'err')}
}
async function adjust(type){
 const email=$('em').value.trim(),amount=Number($('amt').value);
 if(!email||!Number.isInteger(amount)||amount<1){out('กรอกอีเมลและจำนวนเต็มตั้งแต่ 1 ขึ้นไป','err');return}
 if(!confirm((type==='deduct'?'หัก ':'เพิ่ม ')+amount.toLocaleString('th-TH')+' เครดิต ให้ '+email+' ใช่หรือไม่?'))return;
 $('ded').disabled=$('add').disabled=true;out('กำลังดำเนินการ...');
 try{const j=await call({action:'adjust',type,email,amount,note:$('note').value});
  $('bal').textContent=fmt(j.credits);$('amt').value='';out((type==='deduct'?'หัก':'เพิ่ม')+'เครดิตสำเร็จ ยอดคงเหลือใหม่ '+fmt(j.credits),'ok')}
 catch(e){out(e.message,'err')}
 $('ded').disabled=$('add').disabled=false;
}
(async()=>{
 if(!cfg.url||!cfg.anonKey||/YOUR/.test(cfg.url+cfg.anonKey)||!window.supabase){$('fatal').textContent='ตั้งค่า config.js ไม่ถูกต้อง หรือโหลด Supabase ไม่ได้';show('fatal');return}
 sb=supabase.createClient(cfg.url,cfg.anonKey);
 $('look').onclick=look;$('ded').onclick=()=>adjust('deduct');$('add').onclick=()=>adjust('add');
 try{await call({action:'check'});show('panel')}
 catch(e){if(e.status===403)show('forbidden');else if(e.status===401)show('nologin');else{$('fatal').textContent=e.message;show('fatal')}}
})();
</script>
</body>
</html>
